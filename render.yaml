services:
  - type: web
    name: team-engagement-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: team-engagement-db
          property: connectionString
      - key: MAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM_ADDRESS
        sync: false          # You will fill this in Render dashboard
      - key: SMTP_USERNAME
        sync: false          # Your Gmail address
      - key: SMTP_PASSWORD
        sync: false          # Your Gmail App Password
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: AUTO_FALLBACK_SQLITE
        value: false
      - key: ADMIN_API_KEY
        sync: false          # Set a strong secret key
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value

databases:
  - name: team-engagement-db
    plan: free
    databaseName: engagement
    user: engagement_user
