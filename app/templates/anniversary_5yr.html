<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>5 Year Anniversary {{ name }}</title></head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#fffdf5;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(212,175,55,0.25);border:1px solid #d4af37;">
          <tr>
            <td style="background:linear-gradient(135deg,#d4af37,#f9e79f);padding:28px;text-align:center;">
              <img src="{{ company_logo_url }}" alt="{{ company_name }}" height="28" style="margin-bottom:12px;" />
              <h1 style="color:#4a3b00;margin:0;font-size:24px;">🏅 5 Years Strong!</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;text-align:center;">
              <img src="{{ photo_url }}" alt="{{ name }}"
                   width="130" height="130"
                   style="border-radius:50%;object-fit:cover;width:130px;height:130px;border:5px solid #d4af37;" />
              <h2 style="margin:20px 0 4px;color:#2d2d2d;font-size:22px;">{{ name }}</h2>
              <p style="margin:0 0 16px;color:#b8860b;font-size:17px;font-weight:700;">{{ years }} years at {{ company_name }}</p>
              {% if department %}
              <p style="margin:0 0 16px;color:#8a8a8a;font-size:14px;">{{ department }}</p>
              {% endif %}
              <p style="color:#4a4a4a;font-size:15px;line-height:1.6;">
                A special milestone deserves a special thank you. Five years of
                impact, growth, and commitment — congratulations!
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 28px;text-align:center;">
              <p style="color:#b0b0b0;font-size:12px;margin:0;">— From everyone at {{ company_name }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
